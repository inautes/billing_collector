<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crawler Logs - Settlement Crawler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 2rem;
        }
        .log-container {
            height: 70vh;
            overflow-y: auto;
            background-color: #f8f9fa;
            padding: 1rem;
            border-radius: 0.25rem;
            border: 1px solid #dee2e6;
            font-family: monospace;
        }
        .log-entry {
            margin-bottom: 0.5rem;
            padding: 0.5rem;
            border-radius: 0.25rem;
        }
        .log-info {
            background-color: #e9ecef;
        }
        .log-success {
            background-color: #d4edda;
        }
        .log-warning {
            background-color: #fff3cd;
        }
        .log-error {
            background-color: #f8d7da;
        }
        .log-debug {
            background-color: #d1ecf1;
            color: #0c5460;
        }
        .log-timestamp {
            color: #6c757d;
            font-size: 0.8rem;
        }
        .auto-refresh {
            margin-left: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Crawler Logs</h1>
            <div>
                <button id="refreshBtn" class="btn btn-primary">Refresh</button>
                <button id="clearBtn" class="btn btn-outline-danger ms-2">Clear Logs</button>
                <div class="form-check form-switch d-inline-block auto-refresh">
                    <input class="form-check-input" type="checkbox" id="autoRefresh" checked>
                    <label class="form-check-label" for="autoRefresh">Auto-refresh</label>
                </div>
            </div>
        </div>
        
        <div class="mb-3">
            <a href="/" class="btn btn-outline-secondary">Back to Admin</a>
        </div>
        
        <div class="log-container" id="logContainer">
            <p class="text-center text-muted">Loading logs...</p>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const logContainer = document.getElementById('logContainer');
            const refreshBtn = document.getElementById('refreshBtn');
            const clearBtn = document.getElementById('clearBtn');
            const autoRefreshCheckbox = document.getElementById('autoRefresh');
            
            let autoRefreshInterval;
            
            // Load logs initially
            loadLogs();
            
            // Set up auto-refresh
            toggleAutoRefresh();
            
            // Event listeners
            refreshBtn.addEventListener('click', loadLogs);
            clearBtn.addEventListener('click', clearLogs);
            autoRefreshCheckbox.addEventListener('change', toggleAutoRefresh);
            
            function loadLogs() {
                fetch('/api/logs')
                    .then(response => response.json())
                    .then(logs => {
                        if (logs.length === 0) {
                            logContainer.innerHTML = '<p class="text-center text-muted">No logs available</p>';
                            return;
                        }
                        
                        let html = '';
                        logs.forEach(log => {
                            const timestamp = new Date(log.timestamp).toLocaleString();
                            html += `
                                <div class="log-entry log-${log.type}">
                                    <span class="log-timestamp">[${timestamp}]</span>
                                    <span class="log-message">${log.message}</span>
                                </div>
                            `;
                        });
                        
                        logContainer.innerHTML = html;
                        
                        // Scroll to bottom
                        logContainer.scrollTop = logContainer.scrollHeight;
                    })
                    .catch(error => {
                        console.error('Error loading logs:', error);
                        logContainer.innerHTML = '<p class="text-center text-danger">Error loading logs</p>';
                    });
            }
            
            function clearLogs() {
                if (!confirm('Are you sure you want to clear all logs?')) {
                    return;
                }
                
                fetch('/api/logs/clear')
                    .then(response => response.json())
                    .then(data => {
                        logContainer.innerHTML = '<p class="text-center text-muted">No logs available</p>';
                        console.log(data.message);
                    })
                    .catch(error => {
                        console.error('Error clearing logs:', error);
                    });
            }
            
            function toggleAutoRefresh() {
                if (autoRefreshCheckbox.checked) {
                    autoRefreshInterval = setInterval(loadLogs, 3000);
                } else {
                    clearInterval(autoRefreshInterval);
                }
            }
        });
    </script>
</body>
</html>
